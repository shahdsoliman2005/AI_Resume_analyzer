<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Resume Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-intro">
      <div class="brand">Resume Analyzer</div>

      <div class="headline">Every resume, <span class="marked">read like a reviewer.</span></div>
      <p class="sub">Upload a resume and get an honest read on skills, experience and fit — then see it matched against real openings.</p>

      <div class="mock-doc">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <span class="grade">A+</span>
      </div>
    </div>

    <div class="auth-panel">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="lede">Sign in to review a resume or pick up where you left off.</p>

        <div class="tabs">
          <button id="loginTabBtn" class="active" type="button" onclick="showTab('login')">Sign in</button>
          <button id="registerTabBtn" type="button" onclick="showTab('register')">Create account</button>
        </div>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <button type="submit" class="primary">Sign in</button>
          <div class="error" id="loginError"></div>
        </form>

        <form id="registerForm" style="display:none;">
          <div class="field">
            <label for="registerName">Full name</label>
            <input type="text" id="registerName" placeholder="Jordan Lee" required>
          </div>
          <div class="field">
            <label for="registerEmail">Email</label>
            <input type="email" id="registerEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword" placeholder="At least 6 characters" required minlength="6">
          </div>
          <button type="submit" class="primary">Create account</button>
          <div class="error" id="registerError"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
