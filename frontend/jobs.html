<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs — Resume Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">Resume Analyzer</span>
    <div class="tab-group">
      <a href="dashboard.html" class="tab">Review</a>
      <a href="jobs.html" class="tab active">Jobs</a>
    </div>
    <a href="#" class="signout" onclick="logout()">Sign out</a>
  </nav>

  <div class="page">
    <div class="page-head">
      <span class="eyebrow">The board</span>
      <h1>Open roles</h1>
      <p style="color: var(--muted);">Search what's posted, or add a role for the matcher to consider.</p>
    </div>

    <div class="sheet">
      <form id="searchForm" class="search-row">
        <input type="text" id="searchQuery" placeholder="Search by job title…">
        <button type="submit" class="secondary">Search</button>
      </form>

      <table class="ledger" id="jobsTable">
        <thead>
          <tr><th>Role</th><th>Company</th><th>Location</th><th></th></tr>
        </thead>
        <tbody id="jobsTableBody"></tbody>
      </table>
    </div>

    <div class="sheet">
      <span class="eyebrow">New posting</span>
      <h2>Add a role</h2>
      <form id="addJobForm">
        <div class="field">
          <label for="jobTitle">Job title</label>
          <input type="text" id="jobTitle" placeholder="e.g. Backend Engineer" required>
        </div>
        <div class="field">
          <label for="jobCompany">Company</label>
          <input type="text" id="jobCompany" placeholder="e.g. Nile Systems" required>
        </div>
        <div class="field">
          <label for="jobLocation">Location</label>
          <input type="text" id="jobLocation" placeholder="e.g. Cairo, Egypt · Remote">
        </div>
        <div class="field">
          <label for="jobDescription">Description</label>
          <textarea id="jobDescription" rows="4" placeholder="What the role involves…" required></textarea>
        </div>
        <div class="field">
          <label for="jobSkills">Required skills</label>
          <input type="text" id="jobSkills" placeholder="Comma-separated, e.g. Python, SQL, FastAPI">
        </div>
        <button type="submit" class="primary">Add role</button>
      </form>
      <div class="error" id="jobFormError"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
